name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    paths-ignore:
      - '**.md'

jobs:
  build-jvm:
    env:
      DOCKER_ACCOUNT: sogis
      DOCKER_REPO: sodata-api
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION: 0.0.${{ github.run_number }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build 
        run: |
          ./gradlew clean build
          ls -la build/libs

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Smoke test JVM container
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          docker buildx build --load --platform linux/amd64 -f Dockerfile.jvm -t sodata-api:smoke .
          container=$(docker run -d --user 1000830000:0 --read-only --tmpfs /tmp:rw,exec \
            -p 127.0.0.1::8080 \
            --mount "type=bind,src=$PWD/src/test/resources/datasearch.xml,dst=/config/datasearch.xml,readonly" \
            sodata-api:smoke)
          trap 'docker logs "$container"; docker rm -fv "$container"' EXIT
          url="http://$(docker port "$container" 8080/tcp)"
          curl --fail --silent --show-error --max-time 5 --retry 30 --retry-all-errors --retry-delay 2 \
            "$url/actuator/health/readiness" | jq -e '.status == "UP"'
          curl -fsS --max-time 5 "$url/ilisite.xml" > "$RUNNER_TEMP/ilisite.xml"
          curl -fsS --max-time 5 "$url/ilimodels.xml" > "$RUNNER_TEMP/ilimodels.xml"
          curl -fsS --max-time 5 "$url/ilidata.xml" > "$RUNNER_TEMP/ilidata.xml"
          grep -Fq '<shortDescription>Geodatenablage des Kantons Solothurn</shortDescription>' "$RUNNER_TEMP/ilisite.xml"
          grep -Fq '<IliRepository09.RepositoryIndex BID="b1">' "$RUNNER_TEMP/ilimodels.xml"
          grep -Fq '<id>2613.ch.so.agi.av.mopublic</id>' "$RUNNER_TEMP/ilidata.xml"
          grep -Fq '<id>ch.so.afu.abbaustellen</id>' "$RUNNER_TEMP/ilidata.xml"

      - name: Login to Docker Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        if: ${{ (github.ref == 'refs/heads/main') && (github.event_name != 'pull_request') && !env.ACT }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ (github.ref == 'refs/heads/main') && (github.event_name != 'pull_request') && !env.ACT }}

      - name: Build and push to registries
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: Dockerfile.jvm
          pull: true
          push: ${{ (github.ref == 'refs/heads/main') && (github.event_name != 'pull_request') && !env.ACT }}
          tags: |
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:${{ env.VERSION }}
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0.0
            ${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:latest
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:${{ env.VERSION }}
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0.0
            ghcr.io/${{ env.DOCKER_ACCOUNT }}/${{ env.DOCKER_REPO }}:0
